services:
  app:
    image: ghcr.io/jcclaudio/myreserve:latest
    container_name: fixtur-myreserve-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - icontainer.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/myreserve.db
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
