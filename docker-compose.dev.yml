name: myreserve-dev

services:
  db:
    image: mysql:8.0
    container_name: fixtur-myreserve-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: myreserve_dev
      MYSQL_USER: myreserve
      MYSQL_PASSWORD: myreserve_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:20
    container_name: fixtur-myreserve-app-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mysql://myreserve:myreserve_dev_pass@db:3306/myreserve_dev
      - JWT_SECRET=dev-jwt-secret-key-32-chars-long-local-dev
      - COOKIE_SECURE=false
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=MyReserve (Dev)
      - EXCHANGE_API_URL=https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL
      - SEED_ADMIN_EMAIL=agente@myreserve.com.br
      - SEED_ADMIN_PASSWORD=admin123
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npx prisma db push --skip-generate &&
        node prisma/seed.js &&
        npm run dev -- -H 0.0.0.0
      "

volumes:
  mysql_dev_data:
  node_modules:
  next_cache:
