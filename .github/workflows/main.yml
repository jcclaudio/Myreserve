name: CI/CD Pipeline - Deploy to VPS (Docker Compose via SFTP & SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Test & Deploy with Docker Compose to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🧪 Executar testes automatizados
        run: npm test

      - name: 🔐 Gerar arquivo .env para produção
        run: |
          cat << 'EOF' > .env
          NODE_ENV=production
          PORT=${{ secrets.PORT || '3000' }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD || 'root_prod_password' }}
          DB_NAME=${{ secrets.DB_NAME || 'myreserve' }}
          DB_USER=${{ secrets.DB_USER || 'myreserve' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD || 'myreserve_prod_pass' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'minha-chave-secreta-jwt-de-producao-com-ao-menos-32-chars' }}
          COOKIE_SECURE=${{ secrets.COOKIE_SECURE || 'true' }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME || 'MyReserve' }}
          EXCHANGE_API_URL=${{ secrets.EXCHANGE_API_URL || 'https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL' }}
          SEED_ADMIN_EMAIL=${{ secrets.SEED_ADMIN_EMAIL || 'agente@myreserve.com.br' }}
          SEED_ADMIN_PASSWORD=${{ secrets.SEED_ADMIN_PASSWORD || 'admin123' }}
          EOF

      - name: 📦 Empacotar projeto para envio SFTP
        run: |
          mkdir -p /tmp/pkg_build
          tar --warning=no-file-changed \
              --exclude='./node_modules' \
              --exclude='./.next' \
              --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./coverage' \
              --exclude='./.vitest' \
              --exclude='./scratch' \
              --exclude='./tmp' \
              -czf /tmp/pkg_build/deploy.tar.gz .
          mv /tmp/pkg_build/deploy.tar.gz ./deploy.tar.gz
          rm -rf /tmp/pkg_build

      - name: 🚀 Transferir arquivos via SFTP/SCP para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp"
          rm: false

      - name: 💻 Executar Docker Compose no terminal SSH da VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_REMOTE_PATH || '/var/www/myreserve' }}"

            echo "📂 Garantindo existência do diretório de destino: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"

            echo "📦 Descompactando novos arquivos do projeto..."
            tar -xzf /tmp/deploy.tar.gz -C "$TARGET_DIR"
            rm -f /tmp/deploy.tar.gz

            cd "$TARGET_DIR"

            echo "🐳 Subindo containers com Docker Compose..."
            if docker compose version &> /dev/null; then
              docker compose up -d --build
            elif docker-compose --version &> /dev/null; then
              docker-compose up -d --build
            else
              echo "❌ Docker Compose não foi encontrado na VPS. Por favor, instale o Docker e o plugin Docker Compose."
              exit 1
            fi

            echo "🧹 Limpando imagens Docker antigas/órfãs..."
            docker image prune -f || true

            echo "=========================================================="
            echo "🎉 Containers Docker (MySQL + Next.js) rodando na VPS!"
            echo "=========================================================="
